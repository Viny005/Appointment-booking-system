services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: appointment_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointment_dev"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
