name: Application CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: appointment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://appointment:ci-disposable-only@localhost:5432/appointment_test
      TEST_DATABASE_URL: postgresql://appointment:ci-disposable-only@localhost:5432/appointment_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run prisma:migrate
      - name: Verify migration idempotency
        run: npm run prisma:migrate
      - name: Verify upgrade from the merged foundation schema
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE appointment_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/appointment_upgrade_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260929193000_identity_foundation/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/foundation-before-upgrade.sql
          npx prisma migrate resolve --applied 20260929193000_identity_foundation
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/foundation-after-upgrade.sql
      - name: Verify upgrade from merged profile-service main
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE appointment_main_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/appointment_main_upgrade_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260929193000_identity_foundation/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260930090000_profile_service_domain/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          npx prisma migrate resolve --applied 20260929193000_identity_foundation
          npx prisma migrate resolve --applied 20260930090000_profile_service_domain
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-after-availability.sql
      - name: Verify upgrade from merged availability main
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE appointment_availability_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/appointment_availability_upgrade_test
          for migration in 20260929193000_identity_foundation 20260930090000_profile_service_domain 20260930100000_availability_engine; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
            npx prisma migrate resolve --applied "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/availability-before-appointment.sql
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-after-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/availability-after-appointment.sql
      - name: Verify upgrade from appointment core
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE booking_draft_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/booking_draft_upgrade_test
          for migration in 20260929193000_identity_foundation 20260930090000_profile_service_domain 20260930100000_availability_engine 20260930120000_appointment_core; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
            npx prisma migrate resolve --applied "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/appointment-before-draft.sql
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/appointment-after-draft.sql
      - name: Verify upgrade from booking draft
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE notification_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/notification_upgrade_test
          for migration in 20260929193000_identity_foundation 20260930090000_profile_service_domain 20260930100000_availability_engine 20260930120000_appointment_core 20260930150000_booking_draft; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
            npx prisma migrate resolve --applied "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/appointment-before-draft.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/draft-before-notifications.sql
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/draft-after-notifications.sql
      - name: Verify upgrade from notification outbox
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE customer_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/customer_upgrade_test
          for migration in 20260929193000_identity_foundation 20260930090000_profile_service_domain 20260930100000_availability_engine 20260930120000_appointment_core 20260930150000_booking_draft 20260930170000_notification_outbox; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
            npx prisma migrate resolve --applied "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/appointment-before-draft.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/notifications-before-customer.sql
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/notifications-after-customer.sql
      - name: Verify upgrade from customer management
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE internal_upgrade_test'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/internal_upgrade_test
          for migration in 20260929193000_identity_foundation 20260930090000_profile_service_domain 20260930100000_availability_engine 20260930120000_appointment_core 20260930150000_booking_draft 20260930170000_notification_outbox 20261001090000_customer_management; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
            npx prisma migrate resolve --applied "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/main-before-availability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/appointment-before-draft.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/notifications-before-customer.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/customer-before-internal.sql
          npm run prisma:migrate
          npm run prisma:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/customer-after-internal.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Verify development seed against a separate local database
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U appointment -d appointment_test -c 'CREATE DATABASE appointment_dev'
          export DATABASE_URL=postgresql://appointment:ci-disposable-only@localhost:5432/appointment_dev
          npm run prisma:migrate
          export NODE_ENV=development
          export SEED_ADMIN_PASSWORD=$(openssl rand -base64 24)
          npm run prisma:seed
          npm run prisma:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit
      - run: python3 tools/check_docs.py
      - run: git diff --check
